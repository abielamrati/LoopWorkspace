name: Monthly Loop Build

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

jobs:
  dispatch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable and start the official Loop build
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow enable build_loop.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run build_loop.yml --repo "$GITHUB_REPOSITORY" --ref main